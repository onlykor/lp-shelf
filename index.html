<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="내 LP장">
<meta name="theme-color" content="#F1F1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1013" media="(prefers-color-scheme: dark)">
<title>내 LP장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 레코드 가게 진열대 — 상단 검색, 탭으로 컬렉션/위시리스트, 커버 그리드, 하단 시트에서 디스크가 슬리브 밖으로 나오는 상세 */
:root{
  --bg:#F1F1EE; --surface:#FFFFFF; --ink:#16181D; --muted:#6B6E78; --line:#DCDCD6;
  --label:#2742D8; --label-ink:#FFFFFF; --disc:#121316; --groove:#2A2C31;
  --f-display:"Bricolage Grotesque", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-body:"IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1013; --surface:#191A1F; --ink:#ECECE8; --muted:#9A9DA8; --line:#2B2D34;
  --label:#7F93FF; --label-ink:#0F1013; --disc:#050506; --groove:#1E2025; color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,44px);letter-spacing:-.02em;line-height:1;margin:0}
h1 small{display:block;font-family:var(--f-mono);font-weight:400;font-size:12px;letter-spacing:.08em;color:var(--muted);margin-top:8px;text-transform:uppercase}
.tools{display:flex;gap:8px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-visible{outline:2px solid var(--label);outline-offset:2px}
.btn.primary,button.primary{background:var(--label);color:var(--label-ink);border-color:var(--label);font-weight:600}
.search{margin-top:20px;display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.results{margin-top:14px}
.results[hidden]{display:none}
.results-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.tabs{display:flex;gap:4px;margin-top:28px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;border-radius:0;padding:10px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--label)}
.tab .n{font-family:var(--f-mono);font-size:12px;margin-left:4px}
.filters{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.filters input,.filters select{font:inherit;font-size:14px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.filters input{flex:1;min-width:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 16px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;border:0;padding:0;background:none;border-radius:0;color:inherit}
.sleeve{position:relative;width:100%;aspect-ratio:1;max-width:100%}
.sleeve .disc{position:absolute;inset:4%;border-radius:50%;background:repeating-radial-gradient(circle,var(--disc) 0 2px,var(--groove) 2px 3px);transition:transform .35s ease}
.sleeve .disc::after{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--label)}
.sleeve img{position:relative;width:100%;height:100%;object-fit:cover;display:block;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.18),0 6px 16px rgba(0,0,0,.10);background:var(--line)}
.card:hover .disc,.card:focus-visible .disc{transform:translateX(14%)}
.card .t{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .a{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .y{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.badge{position:absolute;top:6px;right:6px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--label);color:var(--label-ink);z-index:1}
.empty{border:1px dashed var(--line);border-radius:16px;padding:32px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:20px;margin-bottom:6px}
.status{font-size:13px;color:var(--muted);padding:8px 0}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:760px){.sheet{left:50%;right:auto;width:720px;transform:translateX(-50%)}}
.sheet-head{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:20px;align-items:end}
@media (max-width:480px){.sheet-head{grid-template-columns:120px minmax(0,1fr);gap:14px}}
.sheet .sleeve .disc{transform:translateX(0);animation:slide .6s .1s ease forwards}
@keyframes slide{to{transform:translateX(22%) rotate(40deg)}}
@media (prefers-reduced-motion:reduce){.sheet .sleeve .disc{animation:none;transform:translateX(22%)}.sleeve .disc{transition:none}}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,4vw,28px);line-height:1.15;margin:0;text-wrap:balance}
.meta{color:var(--muted);font-size:14px;margin-top:4px}
.meta .mono{font-family:var(--f-mono);font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tracks{list-style:none;margin:18px 0 0;padding:0;border-top:1px solid var(--line)}
.tracks li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.tracks .no{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.tracks .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tracks button{padding:4px 10px;font-size:12px}
.tracks button.playing{background:var(--label);color:var(--label-ink);border-color:var(--label)}
label.note{display:block;margin-top:18px;font-size:13px;color:var(--muted)}
textarea{width:100%;font:inherit;font-size:15px;margin-top:6px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:70px;resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30}
.danger{color:#C2362B}

/* ── 턴테이블 화면: 방 안의 파스텔 조명, 왼쪽 클립보드 사진, 오른쪽 회전하는 컬러 바이닐 ── */
.deck{position:fixed;inset:0;z-index:40;overflow:auto;color:#2A2420;
  --vc:#D9A7B0; --vc-deep:color-mix(in srgb,var(--vc) 70%,#3A2A2E); --vc-soft:color-mix(in srgb,var(--vc) 22%,#F7F2EE);
  background:radial-gradient(120% 90% at 85% 10%,#FFFFFF 0,transparent 55%),linear-gradient(160deg,var(--vc-soft),#E9E3DE 70%);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:18px;transition:background .8s}
.deck-top{display:flex;justify-content:space-between;align-items:center}
.deck-top .brand{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:#7A6E68}
.deck button,.deck .btn{background:rgba(255,255,255,.65);border-color:rgba(60,40,40,.12);color:#2A2420;backdrop-filter:blur(6px)}
.deck-stage{flex:1;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(16px,4vw,56px);align-items:center;max-width:1100px;width:100%;margin:0 auto}
@media (max-width:720px){.deck-stage{grid-template-columns:1fr}.deck-stage .clip{max-width:200px}}
.clip{position:relative;margin:0 auto;width:100%;max-width:340px;background:#FBF9F6;padding:22px 16px 18px;border-radius:6px;transform:rotate(-4deg);
  box-shadow:0 2px 4px rgba(0,0,0,.08),0 18px 40px rgba(70,40,40,.18)}
.clip-metal{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:44%;height:28px;border-radius:6px 6px 10px 10px;
  background:linear-gradient(180deg,#E6E6E6,#9C9C9C 55%,#C8C8C8);box-shadow:0 2px 3px rgba(0,0,0,.25)}
.clip img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:2px;background:#ddd}
.clip figcaption{font-family:"Nanum Pen Script",var(--f-body);font-size:26px;line-height:1.1;text-align:center;margin-top:12px;color:#3A302C}
.clip figcaption small{display:block;font-size:20px;color:#7A6E68}
.table{position:relative;width:100%;max-width:600px;aspect-ratio:1.18/1;margin:0 auto}
.platter{position:absolute;left:0;top:6%;width:84%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#D8D4D0 0 60%,#BDB8B3 61% 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.5),0 20px 50px rgba(70,40,40,.18)}
.vinyl{position:absolute;inset:3%;border-radius:50%;
  background:repeating-radial-gradient(circle,rgba(0,0,0,.07) 0 1px,transparent 1px 3px),
    radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--vc) 60%,#fff),var(--vc) 45%,var(--vc-deep));
  animation:spin 1.8s linear infinite;animation-play-state:paused;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.vinyl.on{animation-play-state:running}
.vinyl .swirl{position:absolute;inset:0;border-radius:50%;opacity:.35;
  background:conic-gradient(from 0deg,transparent 0 8%,rgba(255,255,255,.6) 12%,transparent 18% 40%,rgba(80,40,50,.25) 47%,transparent 55% 72%,rgba(255,255,255,.45) 78%,transparent 84%)}
.vinyl .label{position:absolute;inset:33%;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.vinyl .label img{width:100%;height:100%;object-fit:cover;display:block}
.vinyl .hole{position:absolute;left:50%;top:50%;width:3%;height:3%;transform:translate(-50%,-50%);border-radius:50%;background:#EFEAE6;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.sheen{position:absolute;inset:3%;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 300deg,transparent 0 10%,rgba(255,255,255,.35) 15%,transparent 22% 58%,rgba(255,255,255,.22) 63%,transparent 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
.arm{position:absolute;right:2%;top:0;width:15%;height:84%;transform-origin:50% 9%;transform:rotate(0deg);transition:transform .7s cubic-bezier(.4,.1,.2,1)}
.arm.on{transform:rotate(24deg)}
.arm svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 6px rgba(60,30,30,.25))}
@media (prefers-reduced-motion:reduce){.vinyl{animation:none}.arm{transition:none}}
.deck-bar{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px;background:rgba(255,255,255,.55);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.7);border-radius:20px;padding:16px}
.now{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.now-text{min-width:0}
.now-t{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-a{font-size:14px;color:#7A6E68}
.ctrl{display:flex;gap:10px;align-items:center}
.ctrl button{width:44px;height:44px;justify-content:center;padding:0;font-size:16px}
.ctrl button.big{width:56px;height:56px;font-size:20px;background:#2A2420;color:#FBF9F6;border-color:#2A2420}
.prog{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;color:#7A6E68;font-variant-numeric:tabular-nums}
.prog .rail{flex:1;height:4px;border-radius:2px;background:rgba(60,40,40,.12);overflow:hidden}
.prog .rail div{height:100%;width:0;background:var(--vc-deep)}
.deck-links{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.deck-links .hint{font-size:12px;color:#7A6E68}
.queue{list-style:none;margin:0;padding:0;max-height:180px;overflow:auto;border-top:1px solid rgba(60,40,40,.1)}
.queue li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;padding:7px 2px;border-bottom:1px solid rgba(60,40,40,.08);cursor:pointer;font-size:14px}
.queue li .no{font-family:var(--f-mono);font-size:11px;color:#7A6E68;text-align:right;padding-top:2px}
.queue li .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue li.cur{font-weight:600}
.queue li.cur .no{color:var(--vc-deep)}
.queue li.nopv{opacity:.4;cursor:default}
.embed-wrap iframe{width:100%;height:175px;border:0;border-radius:12px;background:transparent}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>내 LP장<small id="count">0 RECORDS · 33⅓ RPM</small></h1>
    <div class="tools">
      <button id="exportBtn" type="button" title="컬렉션을 파일로 백업">백업</button>
      <button id="importBtn" type="button" title="백업 파일 불러오기">불러오기</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </div>
  </header>

  <form class="search" id="searchForm" role="search">
    <input id="q" type="search" placeholder="앨범이나 아티스트 검색 (예: 김광석, Abbey Road)" autocomplete="off" enterkeyhint="search">
    <button class="primary" type="submit">검색</button>
  </form>

  <section class="results" id="results" hidden>
    <div class="results-head"><span id="resultsLabel"></span><button type="button" id="closeResults">닫기</button></div>
    <div class="grid" id="resultsGrid"></div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-collection" aria-selected="true" data-shelf="collection">컬렉션<span class="n" id="n-collection">0</span></button>
    <button class="tab" role="tab" id="tab-wish" aria-selected="false" data-shelf="wish">위시리스트<span class="n" id="n-wish">0</span></button>
  </nav>
  <div class="filters">
    <input id="filter" type="search" placeholder="내 레코드에서 찾기">
    <select id="sort" aria-label="정렬">
      <option value="added">최근 추가순</option>
      <option value="artist">아티스트순</option>
      <option value="year">발매연도순</option>
      <option value="title">앨범명순</option>
    </select>
  </div>
  <div id="shelf"></div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>
<div class="toast" id="toast" hidden></div>
<audio id="player" preload="none"></audio>

<div class="deck" id="deck" role="dialog" aria-label="턴테이블" hidden>
  <div class="deck-top"><span class="brand">NOW SPINNING · 33⅓</span><button type="button" id="deckClose">닫기</button></div>
  <div class="deck-stage">
    <figure class="clip"><div class="clip-metal"></div><img id="deckPhoto" alt=""><figcaption id="deckCaption"></figcaption></figure>
    <div class="table">
      <div class="platter"><div class="vinyl" id="vinyl"><div class="swirl"></div><div class="label"><img id="deckLabel" alt=""></div><div class="hole"></div></div><div class="sheen"></div></div>
      <div class="arm" id="arm" aria-hidden="true">
        <svg viewBox="0 0 60 300" preserveAspectRatio="xMidYMin meet">
          <circle cx="30" cy="27" r="22" fill="#CFCAC5" stroke="#A9A39D" stroke-width="2"/>
          <circle cx="30" cy="27" r="9" fill="#8E8781"/>
          <path d="M30 27 L30 238 L16 268" fill="none" stroke="#B9B3AD" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M30 27 L30 238 L16 268" fill="none" stroke="#EDEAE6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="3" y="262" width="24" height="30" rx="4" transform="rotate(28 15 277)" fill="#3B3533"/>
        </svg>
      </div>
    </div>
  </div>
  <div class="deck-bar">
    <div class="now">
      <div class="now-text"><div class="now-t" id="nowT"></div><div class="now-a" id="nowA"></div></div>
      <div class="ctrl">
        <button type="button" id="prevBtn" aria-label="이전 곡">⏮</button>
        <button type="button" id="playBtn" class="big" aria-label="재생">▶</button>
        <button type="button" id="nextBtn" aria-label="다음 곡">⏭</button>
      </div>
    </div>
    <div class="prog"><span id="tCur">0:00</span><div class="rail"><div id="bar"></div></div><span id="tDur">0:30</span></div>
    <div class="deck-links">
      <a class="btn" id="amLink" href="#" target="_blank" rel="noopener">Apple Music 앱에서 전곡</a>
      <button type="button" id="embedBtn">여기서 전곡 듣기 (애플 로그인)</button>
      <span class="hint" id="deckHint">미리듣기 30초씩 이어서 재생돼요</span>
    </div>
    <div class="embed-wrap" id="embedWrap" hidden><iframe id="embed" title="Apple Music 플레이어" allow="autoplay *; encrypted-media *; clipboard-write" sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation"></iframe></div>
    <ol class="queue" id="queue"></ol>
  </div>
</div>
<audio id="deckAudio" preload="auto"></audio>

<script>
(function(){
  const KEY = "lp-shelf-v1";
  const $ = s => document.querySelector(s);
  let state = { records: [] };
  let shelf = "collection";
  let lastResults = [];

  try { const raw = localStorage.getItem(KEY); if (raw) state = JSON.parse(raw) || state; } catch(e){}
  if (!Array.isArray(state.records)) state.records = [];
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){ toast("저장 공간에 쓸 수 없어요. 백업을 꼭 받아두세요"); } }

  function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2200); }
  function esc(s){ return String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function bigCover(u){ return (u||"").replace(/\/\d+x\d+bb\./,"/600x600bb."); }

  // iTunes Search API (무료·키 불필요). JSONP라서 어떤 정적 호스팅에서도 동작.
  function jsonp(url){
    return new Promise((resolve,reject)=>{
      const cb = "__it" + Date.now() + Math.floor(Math.random()*1e6);
      const s = document.createElement("script");
      const done = () => { delete window[cb]; s.remove(); clearTimeout(timer); };
      const timer = setTimeout(()=>{ done(); reject(new Error("timeout")); }, 12000);
      window[cb] = d => { done(); resolve(d); };
      s.onerror = () => { done(); reject(new Error("network")); };
      s.src = url + (url.includes("?")?"&":"?") + "callback=" + cb;
      document.head.appendChild(s);
    });
  }
  function toRecord(r){
    return { id:String(r.collectionId), title:r.collectionName, artist:r.artistName,
      year:(r.releaseDate||"").slice(0,4), genre:r.primaryGenreName||"", tracks:r.trackCount||0,
      cover:bigCover(r.artworkUrl100), url:r.collectionViewUrl||"" };
  }

  async function search(q){
    $("#results").hidden=false;
    $("#resultsLabel").textContent="검색 중…";
    $("#resultsGrid").innerHTML="";
    try{
      // 한국 스토어 앨범 검색이 비는 경우가 있어서: 앨범+곡 검색을 함께 하고, 비면 다른 스토어로 넘어감
      const seen = new Map(); let failed = 0, tried = 0;
      for (const store of ["KR","US","JP"]){
        const urls = ["album","song"].map(ent=>`https://itunes.apple.com/search?media=music&entity=${ent}&limit=40&country=${store}&term=${encodeURIComponent(q)}`);
        const res = await Promise.allSettled(urls.map(jsonp));
        res.forEach(r=>{ tried++; if(r.status!=="fulfilled"){ failed++; return; }
          (r.value.results||[]).forEach(x=>{ if(!x.collectionId || seen.has(String(x.collectionId))) return;
            const rec = toRecord({...x, artistName:x.collectionArtistName||x.artistName}); rec.store=store; seen.set(rec.id, rec); }); });
        if (seen.size) break;
      }
      if (!seen.size && failed===tried) throw new Error("network");
      lastResults = [...seen.values()].slice(0,40);
      $("#resultsLabel").textContent = lastResults.length ? `‘${q}’ 검색 결과 ${lastResults.length}개 · 탭해서 추가` : `‘${q}’ 결과가 없어요. 영문 표기나 다른 철자로 찾아보세요`;
      $("#resultsGrid").innerHTML = lastResults.map(r=>cardHTML(r,"result")).join("");
    }catch(e){
      $("#resultsLabel").textContent="검색에 실패했어요. 인터넷 연결을 확인하고 다시 시도해 주세요";
    }
  }

  function cardHTML(r, kind){
    const owned = state.records.find(x=>x.id===r.id);
    const badge = kind==="result" && owned ? `<span class="badge">${owned.shelf==="wish"?"위시":"보유"}</span>` : "";
    return `<button class="card" type="button" data-kind="${kind}" data-id="${esc(r.id)}">
      <div class="sleeve"><div class="disc"></div>${badge}<img src="${esc(r.cover)}" alt="" loading="lazy"></div>
      <span class="t">${esc(r.title)}</span><span class="a">${esc(r.artist)}</span><span class="y">${esc(r.year)}${r.genre?" · "+esc(r.genre):""}</span>
    </button>`;
  }

  function renderShelf(){
    const counts = { collection:0, wish:0 };
    state.records.forEach(r=>counts[r.shelf]=(counts[r.shelf]||0)+1);
    $("#n-collection").textContent=counts.collection; $("#n-wish").textContent=counts.wish;
    $("#count").textContent = `${counts.collection} RECORDS · 33⅓ RPM`;
    const f = $("#filter").value.trim().toLowerCase();
    const sort = $("#sort").value;
    let list = state.records.filter(r=>r.shelf===shelf && (!f || (r.title+" "+r.artist+" "+(r.note||"")).toLowerCase().includes(f)));
    const cmp = { added:(a,b)=>b.addedAt-a.addedAt, artist:(a,b)=>a.artist.localeCompare(b.artist,"ko"), year:(a,b)=>(a.year||"9999").localeCompare(b.year||"9999"), title:(a,b)=>a.title.localeCompare(b.title,"ko") }[sort];
    list.sort(cmp);
    const el = $("#shelf");
    if (!state.records.some(r=>r.shelf===shelf)){
      el.innerHTML = shelf==="collection"
        ? `<div class="empty"><strong>아직 꽂힌 레코드가 없어요</strong>위에서 가지고 있는 앨범을 검색하고 ‘컬렉션에 추가’를 누르세요.</div>`
        : `<div class="empty"><strong>위시리스트가 비어 있어요</strong>사고 싶은 앨범을 검색해서 ‘위시리스트에 추가’를 누르세요.</div>`;
      return;
    }
    el.innerHTML = list.length ? `<div class="grid">${list.map(r=>cardHTML(r,"shelf")).join("")}</div>` : `<p class="status">‘${esc(f)}’와 맞는 레코드가 없어요.</p>`;
  }

  // 상세 시트
  let openId = null, openKind = null, sheetSongs = [], sheetAlbum = null;
  async function openSheet(rec, kind){
    openId = rec.id; openKind = kind;
    const owned = state.records.find(x=>x.id===rec.id);
    const r = owned || rec;
    const shelfBtns = owned
      ? `${owned.shelf==="wish" ? `<button type="button" class="primary" data-act="move" data-to="collection">샀어요 · 컬렉션으로</button>` : `<button type="button" data-act="move" data-to="wish">위시리스트로 옮기기</button>`}
         <button type="button" class="danger" data-act="remove">빼기</button>`
      : `<button type="button" class="primary" data-act="add" data-to="collection">컬렉션에 추가</button>
         <button type="button" data-act="add" data-to="wish">위시리스트에 추가</button>`;
    const sheet = $("#sheet");
    sheet.innerHTML = `
      <div class="sheet-head">
        <div class="sleeve"><div class="disc"></div><img src="${esc(r.cover)}" alt="${esc(r.title)} 커버"></div>
        <div style="min-width:0">
          <h2 id="sheetTitle">${esc(r.title)}</h2>
          <div class="meta">${esc(r.artist)}</div>
          <div class="meta mono">${esc(r.year)}${r.genre?" · "+esc(r.genre):""}${r.tracks?" · "+r.tracks+"곡":""}</div>
        </div>
      </div>
      <div class="actions">
        <button type="button" class="primary" data-act="deck" id="deckOpenBtn" disabled>◉ 턴테이블로 듣기</button>
        ${r.url?`<a class="btn" href="${esc(r.url)}" target="_blank" rel="noopener">Apple Music에서 듣기</a>`:""}
        ${shelfBtns}
        <button type="button" data-act="close">닫기</button>
      </div>
      ${owned?`<label class="note" for="noteInput">메모 (구입처, 판본, 상태 등)</label><textarea id="noteInput" placeholder="예: 2024 재발매, 김밥레코즈에서 구입, 상태 좋음">${esc(owned.note||"")}</textarea>`:""}
      <ol class="tracks" id="tracks"><li><span></span><span class="status">수록곡 불러오는 중…</span><span></span></li></ol>`;
    $("#scrim").hidden=false; sheet.hidden=false; document.body.style.overflow="hidden";
    const ni = $("#noteInput");
    if (ni) ni.addEventListener("input", ()=>{ const o=state.records.find(x=>x.id===openId); if(o){ o.note=ni.value; save(); } });
    try{
      const stores = [...new Set([r.store||"KR","KR","US","JP"])];
      let d = {results:[]};
      for (const st of stores){
        d = await jsonp(`https://itunes.apple.com/lookup?entity=song&country=${st}&id=${encodeURIComponent(rec.id)}`);
        if ((d.results||[]).some(x=>x.wrapperType==="track")) break;
      }
      if (openId!==rec.id) return;
      const songs = (d.results||[]).filter(x=>x.wrapperType==="track").sort((a,b)=>(a.discNumber-b.discNumber)||(a.trackNumber-b.trackNumber));
      sheetSongs = songs; sheetAlbum = r;
      const db = $("#deckOpenBtn"); if (db) db.disabled = !songs.some(s=>s.previewUrl);
      $("#tracks").innerHTML = songs.length ? songs.map(s=>`<li><span class="no">${s.trackNumber}</span><span class="nm">${esc(s.trackName)}</span>${s.previewUrl?`<button type="button" data-preview="${esc(s.previewUrl)}">미리듣기</button>`:"<span></span>"}</li>`).join("")
        : `<li><span></span><span class="status">수록곡 정보가 없어요</span><span></span></li>`;
    }catch(e){
      if (openId===rec.id) $("#tracks").innerHTML=`<li><span></span><span class="status">수록곡을 불러오지 못했어요</span><span></span></li>`;
    }
  }
  function closeSheet(){ $("#sheet").hidden=true; $("#scrim").hidden=true; document.body.style.overflow=""; stopAudio(); openId=null; }

  const player = $("#player"); let playingBtn=null;
  function stopAudio(){ player.pause(); if(playingBtn){ playingBtn.classList.remove("playing"); playingBtn.textContent="미리듣기"; playingBtn=null; } }
  player.addEventListener("ended", stopAudio);

  $("#sheet").addEventListener("click", e=>{
    const b = e.target.closest("button"); if(!b) return;
    if (b.dataset.preview){
      if (playingBtn===b){ stopAudio(); return; }
      stopAudio(); player.src=b.dataset.preview; player.play().catch(()=>toast("재생할 수 없어요"));
      b.classList.add("playing"); b.textContent="■ 정지"; playingBtn=b; return;
    }
    const act=b.dataset.act;
    if (act==="close") return closeSheet();
    if (act==="deck"){ const songs=sheetSongs, album=sheetAlbum; closeSheet(); openDeck(album, songs, 0, true); return; }
    if (act==="add"){
      const rec = lastResults.find(x=>x.id===openId); if(!rec) return;
      state.records.push({...rec, shelf:b.dataset.to, addedAt:Date.now(), note:""});
      save(); renderShelf(); refreshResults();
      toast(b.dataset.to==="wish"?"위시리스트에 추가했어요":"컬렉션에 추가했어요");
      openSheet(rec,"shelf");
    }
    if (act==="move"){ const o=state.records.find(x=>x.id===openId); if(o){ o.shelf=b.dataset.to; if(b.dataset.to==="collection") o.addedAt=Date.now(); save(); renderShelf(); refreshResults(); toast(b.dataset.to==="wish"?"위시리스트로 옮겼어요":"컬렉션으로 옮겼어요"); openSheet(o,"shelf"); } }
    if (act==="remove"){
      if (b.dataset.confirm!=="1"){ b.dataset.confirm="1"; b.textContent="정말 뺄까요? 한 번 더 누르기"; return; }
      state.records = state.records.filter(x=>x.id!==openId); save(); renderShelf(); refreshResults(); closeSheet(); toast("뺐어요");
    }
  });
  $("#scrim").addEventListener("click", closeSheet);
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("#sheet").hidden) closeSheet(); });

  function refreshResults(){ if(!$("#results").hidden && lastResults.length) $("#resultsGrid").innerHTML = lastResults.map(r=>cardHTML(r,"result")).join(""); }

  document.addEventListener("click", e=>{
    const c = e.target.closest(".card"); if(!c) return;
    const id=c.dataset.id;
    const rec = c.dataset.kind==="result" ? lastResults.find(x=>x.id===id) : state.records.find(x=>x.id===id);
    if (rec) openSheet(rec, c.dataset.kind);
  });

  $("#searchForm").addEventListener("submit", e=>{ e.preventDefault(); const q=$("#q").value.trim(); if(q) { $("#q").blur(); search(q); } });
  $("#closeResults").addEventListener("click", ()=>{ $("#results").hidden=true; });
  document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click", ()=>{
    shelf=t.dataset.shelf; document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected", String(x===t))); renderShelf();
  }));
  $("#filter").addEventListener("input", renderShelf);
  $("#sort").addEventListener("change", renderShelf);

  // 백업 / 불러오기
  $("#exportBtn").addEventListener("click", ()=>{
    const blob = new Blob([JSON.stringify({app:"lp-shelf",version:1,exportedAt:new Date().toISOString(),records:state.records},null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="lp-shelf-backup-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  });
  $("#importBtn").addEventListener("click", ()=>$("#importFile").click());
  $("#importFile").addEventListener("change", async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const d=JSON.parse(await f.text()); const recs=Array.isArray(d)?d:d.records;
      if(!Array.isArray(recs)) throw 0;
      let added=0; recs.forEach(r=>{ if(r&&r.id&&!state.records.some(x=>x.id===String(r.id))){ state.records.push({...r,id:String(r.id),shelf:r.shelf==="wish"?"wish":"collection",addedAt:r.addedAt||Date.now()}); added++; } });
      save(); renderShelf(); toast(`${added}장을 불러왔어요`);
    }catch(_){ toast("백업 파일 형식이 아니에요"); }
    e.target.value="";
  });

  // ── 턴테이블 ──
  const deckEl=$("#deck"), vinyl=$("#vinyl"), arm=$("#arm"), da=$("#deckAudio");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const deck = { album:null, songs:[], i:0, playing:false, embed:false, dropTimer:null };
  const fmt = s => isFinite(s) ? Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0") : "0:00";

  function tintFrom(url, seed){
    const fallback = ["#D9A7B0","#A8C3D9","#C7B8E0","#E3C29A","#A9D1BC","#E0A99A"][Math.abs([...String(seed)].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7))%6];
    deckEl.style.setProperty("--vc", fallback);
    const img = new Image(); img.crossOrigin = "anonymous";
    img.onload = () => { try{
      const c=document.createElement("canvas"); c.width=c.height=12; const x=c.getContext("2d"); x.drawImage(img,0,0,12,12);
      const p=x.getImageData(0,0,12,12).data; let r=0,g=0,b=0,n=0;
      for(let k=0;k<p.length;k+=4){ const mx=Math.max(p[k],p[k+1],p[k+2]), mn=Math.min(p[k],p[k+1],p[k+2]); const w=1+(mx-mn)/40; r+=p[k]*w; g+=p[k+1]*w; b+=p[k+2]*w; n+=w; }
      r/=n; g/=n; b/=n; const L=(v)=>Math.round(v*.62+255*.38); // 파스텔 쪽으로
      deckEl.style.setProperty("--vc", `rgb(${L(r)},${L(g)},${L(b)})`);
    }catch(_){} };
    img.src = url.replace(/\/\d+x\d+bb\./,"/60x60bb.");
  }

  function openDeck(album, songs, start, autoplay){
    if (!album || !songs.length) return;
    stopAudio();
    deck.album=album; deck.songs=songs; deck.embed=false;
    $("#embedWrap").hidden=true; $("#embed").src="about:blank";
    $("#deckPhoto").src=album.cover; $("#deckLabel").src=album.cover;
    $("#deckCaption").innerHTML = `${esc(album.title)}<small>${esc(album.artist)}${album.year?" · "+esc(album.year):""}</small>`;
    $("#amLink").href = album.url || "#"; $("#amLink").hidden = !album.url;
    tintFrom(album.cover, album.id);
    $("#queue").innerHTML = songs.map((s,k)=>`<li data-i="${k}" class="${s.previewUrl?"":"nopv"}"><span class="no">${s.trackNumber}</span><span class="nm">${esc(s.trackName)}</span></li>`).join("");
    deckEl.hidden=false; document.body.style.overflow="hidden";
    let i = start; while (i<songs.length && !songs[i].previewUrl) i++;
    load(i<songs.length?i:0);
    if (autoplay) play();
  }
  function closeDeck(){ pause(); $("#embed").src="about:blank"; deckEl.hidden=true; document.body.style.overflow=""; }

  function load(i){
    deck.i=i; const s=deck.songs[i];
    $("#nowT").textContent=s.trackName; $("#nowA").textContent=s.artistName;
    da.src = s.previewUrl || ""; $("#bar").style.width="0"; $("#tCur").textContent="0:00"; $("#tDur").textContent="0:30";
    document.querySelectorAll("#queue li").forEach(li=>li.classList.toggle("cur", +li.dataset.i===i));
    const cur=document.querySelector("#queue li.cur"); if(cur) cur.scrollIntoView({block:"nearest"});
    if (deck.embed) setEmbed();
  }
  function setVisual(on){ deck.playing=on; vinyl.classList.toggle("on",on); arm.classList.toggle("on",on);
    $("#playBtn").textContent = on?"❚❚":"▶"; $("#playBtn").setAttribute("aria-label", on?"일시정지":"재생"); }
  function play(){
    if (deck.embed) return;
    setVisual(true); clearTimeout(deck.dropTimer);
    // 톤암이 판 위에 내려앉은 뒤 소리가 나오도록
    deck.dropTimer = setTimeout(()=>{ da.play().catch(()=>{ setVisual(false); toast("재생 버튼을 한 번 더 눌러주세요"); }); }, reduce?0:650);
  }
  function pause(){ clearTimeout(deck.dropTimer); da.pause(); setVisual(false); }
  function step(dir){
    let i=deck.i;
    do { i+=dir; } while (i>=0 && i<deck.songs.length && !deck.songs[i].previewUrl);
    if (i<0 || i>=deck.songs.length){ if(dir>0){ pause(); toast("앨범 끝까지 들었어요"); } return; }
    const was = deck.playing; load(i); if (was || dir>0) { da.play().catch(()=>{}); setVisual(true); }
  }
  function setEmbed(){
    const s=deck.songs[deck.i];
    $("#embed").src = `https://embed.music.apple.com/kr/album/${encodeURIComponent(deck.album.id)}${s&&s.trackId?"?i="+s.trackId:""}`;
  }

  da.addEventListener("timeupdate", ()=>{ $("#tCur").textContent=fmt(da.currentTime); if(da.duration){ $("#tDur").textContent=fmt(da.duration); $("#bar").style.width=(da.currentTime/da.duration*100)+"%"; } });
  da.addEventListener("ended", ()=>step(1));
  $("#playBtn").addEventListener("click", ()=> deck.playing ? pause() : play());
  $("#nextBtn").addEventListener("click", ()=>step(1));
  $("#prevBtn").addEventListener("click", ()=>{ if(da.currentTime>3){ da.currentTime=0; } else step(-1); });
  $("#deckClose").addEventListener("click", closeDeck);
  $("#queue").addEventListener("click", e=>{ const li=e.target.closest("li"); if(!li||li.classList.contains("nopv")) return; load(+li.dataset.i); play(); });
  $("#embedBtn").addEventListener("click", ()=>{
    deck.embed = !deck.embed;
    if (deck.embed){
      clearTimeout(deck.dropTimer); da.pause(); setVisual(true);
      setEmbed(); $("#embedWrap").hidden=false;
      $("#embedBtn").textContent="미리듣기로 돌아가기";
      $("#deckHint").textContent="애플 플레이어에서 로그인하면 전곡이 재생돼요";
    } else {
      $("#embed").src="about:blank"; $("#embedWrap").hidden=true; setVisual(false);
      $("#embedBtn").textContent="여기서 전곡 듣기 (애플 로그인)";
      $("#deckHint").textContent="미리듣기 30초씩 이어서 재생돼요";
    }
  });
  document.addEventListener("keydown", e=>{
    if (deckEl.hidden) return;
    if (e.key==="Escape") closeDeck();
    if (e.key===" " && !/INPUT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)){ e.preventDefault(); deck.playing?pause():play(); }
  });

  renderShelf();
})();
</script>
</body>
</html>
