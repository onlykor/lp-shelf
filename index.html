<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="내 LP장">
<meta name="theme-color" content="#F1F1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1013" media="(prefers-color-scheme: dark)">
<title>내 LP장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 레코드 가게 진열대 — 상단 검색, 탭으로 컬렉션/위시리스트, 커버 그리드, 하단 시트에서 디스크가 슬리브 밖으로 나오는 상세 */
:root{
  --bg:#F1F1EE; --surface:#FFFFFF; --ink:#16181D; --muted:#6B6E78; --line:#DCDCD6;
  --label:#2742D8; --label-ink:#FFFFFF; --disc:#121316; --groove:#2A2C31;
  --f-display:"Bricolage Grotesque", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-body:"IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1013; --surface:#191A1F; --ink:#ECECE8; --muted:#9A9DA8; --line:#2B2D34;
  --label:#7F93FF; --label-ink:#0F1013; --disc:#050506; --groove:#1E2025; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1013; --surface:#191A1F; --ink:#ECECE8; --muted:#9A9DA8; --line:#2B2D34;
  --label:#7F93FF; --label-ink:#0F1013; --disc:#050506; --groove:#1E2025; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,44px);letter-spacing:-.02em;line-height:1;margin:0}
h1 small{display:block;font-family:var(--f-mono);font-weight:400;font-size:12px;letter-spacing:.08em;color:var(--muted);margin-top:8px;text-transform:uppercase}
.tools{display:flex;gap:8px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-visible{outline:2px solid var(--label);outline-offset:2px}
.btn.primary,button.primary{background:var(--label);color:var(--label-ink);border-color:var(--label);font-weight:600}
.search{margin-top:20px;display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.results{margin-top:14px}
.results[hidden]{display:none}
.results-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.tabs{display:flex;gap:4px;margin-top:28px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;border-radius:0;padding:10px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--label)}
.tab .n{font-family:var(--f-mono);font-size:12px;margin-left:4px}
.filters{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.filters input,.filters select{font:inherit;font-size:14px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.filters input{flex:1;min-width:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 16px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;border:0;padding:0;background:none;border-radius:0;color:inherit}
.sleeve{position:relative;width:100%;aspect-ratio:1;max-width:100%}
.sleeve .disc{position:absolute;inset:4%;border-radius:50%;background:repeating-radial-gradient(circle,var(--disc) 0 2px,var(--groove) 2px 3px);transition:transform .35s ease}
.sleeve .disc::after{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--label)}
.sleeve img{position:relative;width:100%;height:100%;object-fit:cover;display:block;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.18),0 6px 16px rgba(0,0,0,.10);background:var(--line)}
.card:hover .disc,.card:focus-visible .disc{transform:translateX(14%)}
.card .t{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .a{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .y{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.badge{position:absolute;top:6px;right:6px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--label);color:var(--label-ink);z-index:1}
.empty{border:1px dashed var(--line);border-radius:16px;padding:32px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:20px;margin-bottom:6px}
.status{font-size:13px;color:var(--muted);padding:8px 0}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:760px){.sheet{left:50%;right:auto;width:720px;transform:translateX(-50%)}}
.sheet-head{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:20px;align-items:end}
@media (max-width:480px){.sheet-head{grid-template-columns:120px minmax(0,1fr);gap:14px}}
.sheet .sleeve .disc{transform:translateX(0);animation:slide .6s .1s ease forwards}
@keyframes slide{to{transform:translateX(22%) rotate(40deg)}}
@media (prefers-reduced-motion:reduce){.sheet .sleeve .disc{animation:none;transform:translateX(22%)}.sleeve .disc{transition:none}}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,4vw,28px);line-height:1.15;margin:0;text-wrap:balance}
.meta{color:var(--muted);font-size:14px;margin-top:4px}
.meta .mono{font-family:var(--f-mono);font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tracks{list-style:none;margin:18px 0 0;padding:0;border-top:1px solid var(--line)}
.tracks li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.tracks .no{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.tracks .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tracks button{padding:4px 10px;font-size:12px}
.tracks button.playing{background:var(--label);color:var(--label-ink);border-color:var(--label)}
label.note{display:block;margin-top:18px;font-size:13px;color:var(--muted)}
textarea{width:100%;font:inherit;font-size:15px;margin-top:6px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:70px;resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30}
.danger{color:#C2362B}

/* ── 턴테이블 화면: 조용한 방 안, 위에서 내려다본 화이트 턴테이블 + 옆 패널 ── */
.deck{position:fixed;inset:0;z-index:40;overflow:auto;color:var(--d-ink);
  --vc:#9AA3B5; --vc-deep:color-mix(in srgb,var(--vc) 70%,#2A2A30);
  --d-ink:#26272B; --d-muted:#7C7D82; --d-room:#F3F3F1; --d-floor:#E6E6E3; --d-light:#FFFFFF;
  --d-glass:rgba(255,255,255,.6); --d-glass-line:rgba(255,255,255,.8); --d-btn:rgba(255,255,255,.75); --d-hair:rgba(30,30,40,.1);
  --d-play:#26272B; --d-play-ink:#FAFAF8; --d-accent:var(--vc-deep);
  background:radial-gradient(110% 80% at 30% 0%,var(--d-light) 0,transparent 60%),linear-gradient(170deg,var(--d-room),var(--d-floor));
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .deck{
  --d-ink:#E8E8E5; --d-muted:#8E8F95; --d-room:#17181B; --d-floor:#0C0C0E; --d-light:rgba(255,255,255,.05);
  --d-glass:rgba(28,29,33,.7); --d-glass-line:rgba(255,255,255,.06); --d-btn:rgba(255,255,255,.07); --d-hair:rgba(255,255,255,.09);
  --d-play:#E8E8E5; --d-play-ink:#121214; --d-accent:color-mix(in srgb,var(--vc) 75%,#fff);
}}
:root[data-theme="dark"] .deck{
  --d-ink:#E8E8E5; --d-muted:#8E8F95; --d-room:#17181B; --d-floor:#0C0C0E; --d-light:rgba(255,255,255,.05);
  --d-glass:rgba(28,29,33,.7); --d-glass-line:rgba(255,255,255,.06); --d-btn:rgba(255,255,255,.07); --d-hair:rgba(255,255,255,.09);
  --d-play:#E8E8E5; --d-play-ink:#121214; --d-accent:color-mix(in srgb,var(--vc) 75%,#fff);
}
.deck-top{display:flex;justify-content:space-between;align-items:center}
.deck-top .brand{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--d-muted)}
.deck button,.deck .btn{background:var(--d-btn);border-color:var(--d-hair);color:var(--d-ink);backdrop-filter:blur(6px)}
.deck-stage{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:clamp(16px,4vw,48px);align-items:center;max-width:1100px;width:100%;margin:0 auto}
@media (max-width:820px){.deck-stage{grid-template-columns:minmax(0,1fr)}}
.tt-wrap{display:flex;justify-content:center;min-width:0}
#tt{display:block;width:min(100%,540px,calc((100vh - 110px) * .7));aspect-ratio:.7;max-width:100%;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
#tt:focus-visible{outline:2px solid var(--d-accent);outline-offset:6px;border-radius:40px}
.panel{display:flex;flex-direction:column;gap:12px;background:var(--d-glass);backdrop-filter:blur(10px);border:1px solid var(--d-glass-line);border-radius:20px;padding:16px;min-width:0}
.now{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center}
.now img{width:56px;height:56px;border-radius:6px;object-fit:cover;background:var(--d-hair);display:block}
.now-t{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-a{font-size:13px;color:var(--d-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px}
.ctrl button{justify-content:center;padding:10px 8px;font-size:14px}
.ctrl button.big{background:var(--d-play);color:var(--d-play-ink);border-color:var(--d-play);font-weight:600}
.prog{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;color:var(--d-muted);font-variant-numeric:tabular-nums}
.prog .rail{flex:1;height:4px;border-radius:2px;background:var(--d-hair);overflow:hidden}
.prog .rail div{height:100%;width:0;background:var(--d-accent)}
.hint{margin:0;font-size:12px;line-height:1.6;color:var(--d-muted)}
.deck-links{display:flex;flex-wrap:wrap;gap:8px}
.deck-links .btn,.deck-links button{font-size:13px;padding:7px 12px}
.queue{list-style:none;margin:0;padding:0;max-height:200px;overflow:auto;border-top:1px solid var(--d-hair)}
.queue li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;padding:7px 2px;border-bottom:1px solid var(--d-hair);cursor:pointer;font-size:14px}
.queue li .no{font-family:var(--f-mono);font-size:11px;color:var(--d-muted);text-align:right;padding-top:2px}
.queue li .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue li.cur{font-weight:600}
.queue li.cur .no{color:var(--d-accent)}
.queue li.nopv{opacity:.4;cursor:default}
.embed-wrap iframe{width:100%;height:175px;border:0;border-radius:12px;background:transparent}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>내 LP장<small id="count">0 RECORDS · 33⅓ RPM</small></h1>
    <div class="tools">
      <button id="themeBtn" type="button" aria-label="화면 테마 바꾸기">◐ 자동</button>
      <button id="exportBtn" type="button" title="컬렉션을 파일로 백업">백업</button>
      <button id="importBtn" type="button" title="백업 파일 불러오기">불러오기</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </div>
  </header>

  <form class="search" id="searchForm" role="search">
    <input id="q" type="search" placeholder="앨범이나 아티스트 검색 (예: 김광석, Abbey Road)" autocomplete="off" enterkeyhint="search">
    <button class="primary" type="submit">검색</button>
  </form>

  <section class="results" id="results" hidden>
    <div class="results-head"><span id="resultsLabel"></span><button type="button" id="closeResults">닫기</button></div>
    <div class="grid" id="resultsGrid"></div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-collection" aria-selected="true" data-shelf="collection">컬렉션<span class="n" id="n-collection">0</span></button>
    <button class="tab" role="tab" id="tab-wish" aria-selected="false" data-shelf="wish">위시리스트<span class="n" id="n-wish">0</span></button>
  </nav>
  <div class="filters">
    <input id="filter" type="search" placeholder="내 레코드에서 찾기">
    <select id="sort" aria-label="정렬">
      <option value="added">최근 추가순</option>
      <option value="artist">아티스트순</option>
      <option value="year">발매연도순</option>
      <option value="title">앨범명순</option>
    </select>
  </div>
  <div id="shelf"></div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>
<div class="toast" id="toast" hidden></div>
<audio id="player" preload="none"></audio>

<div class="deck" id="deck" role="dialog" aria-label="턴테이블" hidden>
  <div class="deck-top"><span class="brand">NOW SPINNING</span><button type="button" id="deckClose">닫기</button></div>
  <div class="deck-stage">
    <div class="tt-wrap"><canvas id="tt" tabindex="0" aria-label="턴테이블. 스페이스로 재생·정지, 좌우 화살표로 곡 넘김, 위아래 화살표로 볼륨"></canvas></div>
    <div class="panel">
      <div class="now"><img id="nowCover" alt=""><div style="min-width:0"><div class="now-t" id="nowT"></div><div class="now-a" id="nowA"></div></div></div>
      <div class="prog"><span id="tCur">0:00</span><div class="rail"><div id="bar"></div></div><span id="tDur">0:30</span></div>
      <div class="ctrl">
        <button type="button" id="prevBtn">⏮ 이전</button>
        <button type="button" id="playBtn" class="big">▶ 재생</button>
        <button type="button" id="nextBtn">다음 ⏭</button>
      </div>
      <p class="hint" id="deckHint">톤암을 판 위로 끌어 올리면 재생, 내리면 정지 · 판을 좌우로 밀면 곡 넘김 · 왼쪽 위 노브를 돌려 볼륨 조절</p>
      <div class="deck-links">
        <a class="btn" id="amLink" href="#" target="_blank" rel="noopener">Apple Music 앱에서 전곡</a>
        <button type="button" id="embedBtn">여기서 전곡 듣기 (애플 로그인)</button>
      </div>
      <div class="embed-wrap" id="embedWrap" hidden><iframe id="embed" title="Apple Music 플레이어" allow="autoplay *; encrypted-media *; clipboard-write" sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation"></iframe></div>
      <ol class="queue" id="queue"></ol>
    </div>
  </div>
</div>
<audio id="deckAudio" preload="auto" crossorigin="anonymous"></audio>
<audio id="deckAudio2" preload="auto"></audio>


<script>
(function(){
  const KEY = "lp-shelf-v1";
  const $ = s => document.querySelector(s);
  let state = { records: [] };
  let shelf = "collection";
  let lastResults = [];

  try { const raw = localStorage.getItem(KEY); if (raw) state = JSON.parse(raw) || state; } catch(e){}
  if (!Array.isArray(state.records)) state.records = [];
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){ toast("저장 공간에 쓸 수 없어요. 백업을 꼭 받아두세요"); } }

  function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2200); }
  function esc(s){ return String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function bigCover(u){ return (u||"").replace(/\/\d+x\d+bb\./,"/600x600bb."); }

  // iTunes Search API (무료·키 불필요). JSONP라서 어떤 정적 호스팅에서도 동작.
  function jsonp(url){
    return new Promise((resolve,reject)=>{
      const cb = "__it" + Date.now() + Math.floor(Math.random()*1e6);
      const s = document.createElement("script");
      const done = () => { delete window[cb]; s.remove(); clearTimeout(timer); };
      const timer = setTimeout(()=>{ done(); reject(new Error("timeout")); }, 12000);
      window[cb] = d => { done(); resolve(d); };
      s.onerror = () => { done(); reject(new Error("network")); };
      s.src = url + (url.includes("?")?"&":"?") + "callback=" + cb;
      document.head.appendChild(s);
    });
  }
  function toRecord(r){
    return { id:String(r.collectionId), title:r.collectionName, artist:r.artistName,
      year:(r.releaseDate||"").slice(0,4), genre:r.primaryGenreName||"", tracks:r.trackCount||0,
      cover:bigCover(r.artworkUrl100), url:r.collectionViewUrl||"" };
  }

  async function search(q){
    $("#results").hidden=false;
    $("#resultsLabel").textContent="검색 중…";
    $("#resultsGrid").innerHTML="";
    try{
      // 한국 스토어 앨범 검색이 비는 경우가 있어서: 앨범+곡 검색을 함께 하고, 비면 다른 스토어로 넘어감
      const seen = new Map(); let failed = 0, tried = 0;
      for (const store of ["KR","US","JP"]){
        const urls = ["album","song"].map(ent=>`https://itunes.apple.com/search?media=music&entity=${ent}&limit=40&country=${store}&term=${encodeURIComponent(q)}`);
        const res = await Promise.allSettled(urls.map(jsonp));
        res.forEach(r=>{ tried++; if(r.status!=="fulfilled"){ failed++; return; }
          (r.value.results||[]).forEach(x=>{ if(!x.collectionId || seen.has(String(x.collectionId))) return;
            const rec = toRecord({...x, artistName:x.collectionArtistName||x.artistName}); rec.store=store; seen.set(rec.id, rec); }); });
        if (seen.size) break;
      }
      if (!seen.size && failed===tried) throw new Error("network");
      lastResults = [...seen.values()].slice(0,40);

  // ── 턴테이블 (캔버스) ──
  const deckEl=$("#deck"), cv=$("#tt"), cx=cv.getContext("2d");

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TT = { W:700, H:1000, C:{x:350,y:395}, R:262, LR:90, P:{x:470,y:800}, L:335, REST:180, MAX:246, DROP:222,
               VK:{x:120,y:122,r:50}, SK:{x:120,y:892,r:42} };
  const PERIOD = { 33:5.2, 45:3.9 };   // 한 바퀴 도는 시간(초). 실제보다 느리게
  const deck = { album:null, songs:[], i:0, embed:false,
    arm:TT.REST, armTarget:null, armDrag:null, pendingPlay:false, wantAudio:false,
    angle:0, omega:0, speed:33,
    slide:{x:0, drag:null, phase:null, dir:0},
    vol:0.8, knobDrag:null, tex:null, cover:null, raf:0, last:0 };
  try{ const v=parseFloat(localStorage.getItem("lp-shelf-vol")); if(v>=0&&v<=1) deck.vol=v; }catch(_){}
  const fmt = s => isFinite(s) ? Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0") : "0:00";
  const rad = d => d*Math.PI/180;
  const isDark = () => { const a=document.documentElement.getAttribute("data-theme"); return a ? a==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
  const PAL = {
    light:{ hi:"#FFFFFF", lo:"#E9E9E6", edge:"rgba(255,255,255,.95)", shadow:"rgba(30,30,40,.22)", platter:"#D6D6D2", knob:"#FCFCFB", knobLo:"#DEDEDA",
            ink:"#3A3B3F", mark:"#BDBDB8", slot:"#ECECE9", text:"#9A9A95", head:"#2C2C2E", led:"#58C27D", ledOff:"#D3D3CF" },
    dark: { hi:"#34353A", lo:"#1E1F22", edge:"rgba(255,255,255,.07)", shadow:"rgba(0,0,0,.65)", platter:"#121214", knob:"#3A3B40", knobLo:"#24252A",
            ink:"#E6E6E2", mark:"#55565D", slot:"#1A1B1E", text:"#77787E", head:"#0E0E10", led:"#58C27D", ledOff:"#3A3B40" } };

  // 오디오: 볼륨은 아이패드에서도 먹히도록 WebAudio 게인으로
  let actx=null, gainNode=null, useFallback=false;
  const cur = () => useFallback ? da2 : da;
  function ensureCtx(){
    if (actx){ if (actx.state==="suspended") actx.resume(); return; }
    try{
      const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
      actx = new AC(); const src = actx.createMediaElementSource(da);
      gainNode = actx.createGain(); src.connect(gainNode); gainNode.connect(actx.destination);
      applyVol();
    }catch(_){ actx=null; gainNode=null; }
  }
  function applyVol(){
    const g = deck.vol*deck.vol;
    if (gainNode){ gainNode.gain.value = g; da.volume = 1; } else da.volume = g;
    da2.volume = g;
  }
  da.addEventListener("error", ()=>{
    // 미리듣기 서버가 교차 출처를 막으면 일반 재생으로 전환
    if (useFallback || !da.getAttribute("src")) return;
    useFallback = true; const s = deck.songs[deck.i]; da2.src = s ? s.previewUrl : ""; applyVol();
    if (deck.wantAudio) da2.play().catch(()=>{});
  });
  [da,da2].forEach(a=>{
    a.addEventListener("timeupdate", ()=>{ if(a!==cur()) return; $("#tCur").textContent=fmt(a.currentTime); if(a.duration){ $("#tDur").textContent=fmt(a.duration); $("#bar").style.width=(a.currentTime/a.duration*100)+"%"; } });
    a.addEventListener("ended", ()=>{ if(a===cur()) onEnded(); });
  });

  // 레코드 텍스처 (곡 수만큼 트랙 경계 홈)
  function buildVinyl(){
    const s = Math.min(2, (window.devicePixelRatio||1)); const R=TT.R, D=R*2;
    const c=document.createElement("canvas"); c.width=c.height=Math.round(D*s); const x=c.getContext("2d");
    x.scale(s,s); x.translate(R,R);
    let g=x.createRadialGradient(0,0,TT.LR,0,0,R); g.addColorStop(0,"#1D1D1F"); g.addColorStop(1,"#0E0E0F");
    x.fillStyle=g; x.beginPath(); x.arc(0,0,R,0,Math.PI*2); x.fill();
    let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
    for (let r=TT.LR+20; r<R-5; r+=1.1){ x.strokeStyle=`rgba(255,255,255,${0.012+rnd()*0.03})`; x.lineWidth=.6; x.beginPath(); x.arc(0,0,r,0,Math.PI*2); x.stroke(); }
    const n = Math.max(3, Math.min(14, deck.songs.length||6)), r0=TT.LR+24, r1=R-8;
    for (let k=1;k<n;k++){ const r=r1-(r1-r0)*k/n;
      x.strokeStyle="rgba(0,0,0,.75)"; x.lineWidth=2.4; x.beginPath(); x.arc(0,0,r,0,Math.PI*2); x.stroke();
      x.strokeStyle="rgba(255,255,255,.07)"; x.lineWidth=1; x.beginPath(); x.arc(0,0,r+1.6,0,Math.PI*2); x.stroke(); }
    x.fillStyle="#161617"; x.beginPath(); x.arc(0,0,TT.LR+16,0,Math.PI*2); x.fill();
    x.strokeStyle="rgba(255,255,255,.1)"; x.lineWidth=2.5; x.beginPath(); x.arc(0,0,R-1.5,0,Math.PI*2); x.stroke();
    x.save(); x.beginPath(); x.arc(0,0,TT.LR,0,Math.PI*2); x.clip();
    if (deck.cover && deck.cover.complete && deck.cover.naturalWidth) x.drawImage(deck.cover,-TT.LR,-TT.LR,TT.LR*2,TT.LR*2);
    else { x.fillStyle="#E8E3DA"; x.fillRect(-TT.LR,-TT.LR,TT.LR*2,TT.LR*2); }
    x.restore();
    x.strokeStyle="rgba(0,0,0,.35)"; x.lineWidth=2; x.beginPath(); x.arc(0,0,TT.LR,0,Math.PI*2); x.stroke();
    deck.tex = c;
  }

  function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
  function tip(th){ return { x:TT.P.x+TT.L*Math.cos(rad(th)), y:TT.P.y+TT.L*Math.sin(rad(th)) }; }
  function onRecord(th){ const t=tip(th), d=Math.hypot(t.x-TT.C.x-deck.slide.x, t.y-TT.C.y); return d < TT.R-6 && d > TT.LR+10; }

  function knob(K, a, p, dots, fill){
    cx.save(); cx.shadowColor=p.shadow; cx.shadowBlur=22; cx.shadowOffsetY=10;
    cx.fillStyle=p.knob; cx.beginPath(); cx.arc(K.x,K.y,K.r,0,Math.PI*2); cx.fill(); cx.restore();
    let g=cx.createRadialGradient(K.x-K.r*.35,K.y-K.r*.45,K.r*.1,K.x,K.y,K.r); g.addColorStop(0,p.hi); g.addColorStop(1,p.knobLo);
    cx.fillStyle=g; cx.beginPath(); cx.arc(K.x,K.y,K.r,0,Math.PI*2); cx.fill();
    cx.strokeStyle=p.edge; cx.lineWidth=1.5; cx.beginPath(); cx.arc(K.x,K.y,K.r-1,0,Math.PI*2); cx.stroke();
    g=cx.createRadialGradient(K.x,K.y,0,K.x,K.y,K.r*.72); g.addColorStop(0,p.knob); g.addColorStop(1,p.knobLo);
    cx.fillStyle=g; cx.beginPath(); cx.arc(K.x,K.y,K.r*.72,0,Math.PI*2); cx.fill();
    cx.strokeStyle=p.ink; cx.lineCap="round"; cx.lineWidth=3;
    cx.beginPath(); cx.moveTo(K.x+Math.sin(a)*K.r*.42, K.y-Math.cos(a)*K.r*.42); cx.lineTo(K.x+Math.sin(a)*K.r*.68, K.y-Math.cos(a)*K.r*.68); cx.stroke();
    if (dots) for (let i=0;i<=dots;i++){ const b=rad(-135+270*i/dots), R=K.r+15;
      cx.fillStyle = (fill!=null && i/dots<=fill+1e-6) ? p.ink : p.mark;
      cx.beginPath(); cx.arc(K.x+Math.sin(b)*R, K.y-Math.cos(b)*R, i%5===0?2.6:1.7, 0, Math.PI*2); cx.fill(); }
  }

  function draw(){
    const p = isDark() ? PAL.dark : PAL.light;
    cx.clearRect(0,0,TT.W,TT.H);
    // 본체
    cx.save(); cx.shadowColor=p.shadow; cx.shadowBlur=28; cx.shadowOffsetY=14; rr(32,20,636,946,60); cx.fillStyle=p.lo; cx.fill(); cx.restore();
    let g=cx.createLinearGradient(0,20,0,966); g.addColorStop(0,p.hi); g.addColorStop(1,p.lo); rr(32,20,636,946,60); cx.fillStyle=g; cx.fill();
    cx.strokeStyle=p.edge; cx.lineWidth=2; rr(34,22,632,942,58); cx.stroke();
    // 플래터 + 그림자
    cx.save(); cx.shadowColor="rgba(0,0,0,.28)"; cx.shadowBlur=26; cx.shadowOffsetY=12;
    cx.fillStyle=p.platter; cx.beginPath(); cx.arc(TT.C.x,TT.C.y,TT.R+4,0,Math.PI*2); cx.fill(); cx.restore();
    // 레코드
    const vx = TT.C.x + deck.slide.x;
    if (deck.tex){
      cx.save(); cx.shadowColor="rgba(0,0,0,.35)"; cx.shadowBlur=14; cx.shadowOffsetY=6;
      cx.translate(vx,TT.C.y); cx.rotate(deck.angle); cx.drawImage(deck.tex,-TT.R,-TT.R,TT.R*2,TT.R*2); cx.restore();
      // 고정된 빛 반사
      cx.save(); cx.beginPath(); cx.arc(vx,TT.C.y,TT.R-2,0,Math.PI*2); cx.arc(vx,TT.C.y,TT.LR+2,0,Math.PI*2,true); cx.clip();
      if (cx.createConicGradient){ g=cx.createConicGradient(-0.9, vx, TT.C.y);
        [[0,0],[.07,.16],[.13,0],[.5,0],[.57,.11],[.63,0],[1,0]].forEach(([o,a])=>g.addColorStop(o,`rgba(255,255,255,${a})`));
        cx.fillStyle=g; cx.fillRect(vx-TT.R,TT.C.y-TT.R,TT.R*2,TT.R*2); }
      cx.restore();
    }
    // 스핀들
    g=cx.createRadialGradient(TT.C.x-2,TT.C.y-2,0,TT.C.x,TT.C.y,6); g.addColorStop(0,"#FFFFFF"); g.addColorStop(1,"#8A8A88");

    cx.fillText("VOL", TT.VK.x, TT.VK.y+TT.VK.r+36);
    knob(TT.SK, rad(deck.speed===33?-40:40), p, 0);
    cx.fillStyle = deck.speed===33 ? p.ink : p.text; cx.fillText("33", TT.SK.x-34, TT.SK.y+64);
    cx.fillStyle = deck.speed===45 ? p.ink : p.text; cx.fillText("45", TT.SK.x+34, TT.SK.y+64);
    // 표시등 + 이름
    const on = spinning();
    cx.save(); if(on){ cx.shadowColor=p.led; cx.shadowBlur=14; } cx.fillStyle = on ? p.led : p.ledOff;
    cx.beginPath(); cx.arc(262,930,6,0,Math.PI*2); cx.fill(); cx.restore();
    cx.fillStyle=p.text; cx.font="500 12px 'IBM Plex Mono', monospace"; cx.textAlign="left"; cx.fillText("PLAY", 276, 934);
    cx.save(); cx.translate(628,72); cx.rotate(Math.PI/2); cx.textAlign="left"; cx.font="500 15px 'IBM Plex Mono', monospace"; cx.fillText("LP · 01", 0, 0); cx.restore();
    // 톤암 받침 홈
    rr(TT.P.x-150, TT.P.y-34, 210, 68, 34); cx.fillStyle=p.slot; cx.fill();
    cx.strokeStyle=p.edge; cx.lineWidth=1.5; cx.stroke();
    // 암 레스트
    const restX = TT.P.x - TT.L + 34;
    cx.save(); cx.shadowColor=p.shadow; cx.shadowBlur=6; cx.shadowOffsetY=3; cx.fillStyle="#BDBDBA"; rr(restX-4, TT.P.y-6, 8, 38, 4); cx.fill(); cx.restore();
    // 톤암
    const lifted = !!deck.armDrag || (deck.armTarget!=null);
    cx.save(); cx.translate(TT.P.x,TT.P.y); cx.rotate(rad(deck.arm));
    cx.shadowColor="rgba(0,0,0,.3)"; cx.shadowBlur = lifted?16:7; cx.shadowOffsetX = lifted?8:3; cx.shadowOffsetY = lifted?16:6;
    g=cx.createLinearGradient(0,-5,0,5); g.addColorStop(0,"#9C9C9A"); g.addColorStop(.35,"#F7F7F5"); g.addColorStop(1,"#8E8E8C");
    cx.fillStyle=g; rr(-118,-4.5,TT.L-28+118,9,4.5); cx.fill();
    cx.shadowColor="transparent";
    g=cx.createLinearGradient(0,-17,0,17); g.addColorStop(0,"#8F8F8D"); g.addColorStop(.4,"#F4F4F2"); g.addColorStop(1,"#7E7E7C");
    cx.fillStyle=g; rr(-172,-17,56,34,5); cx.fill();
    cx.strokeStyle="rgba(0,0,0,.12)"; cx.lineWidth=1; for(let k=-166;k<-120;k+=4){ cx.beginPath(); cx.moveTo(k,-16); cx.lineTo(k,16); cx.stroke(); }
    cx.fillStyle=p.head; rr(TT.L-36,-10,40,24,4); cx.fill();
    cx.strokeStyle="#C9C9C6"; cx.lineWidth=3; cx.lineCap="round"; cx.beginPath(); cx.moveTo(TT.L-22,-10); cx.lineTo(TT.L-14,-24); cx.stroke();
    cx.restore();
    // 피벗 원판
    cx.save(); cx.shadowColor=p.shadow; cx.shadowBlur=18; cx.shadowOffsetY=8;
    cx.fillStyle=p.knob; cx.beginPath(); cx.arc(TT.P.x,TT.P.y,40,0,Math.PI*2); cx.fill(); cx.restore();
    g=cx.createRadialGradient(TT.P.x-14,TT.P.y-16,4,TT.P.x,TT.P.y,40); g.addColorStop(0,p.hi); g.addColorStop(1,p.knobLo);
    cx.fillStyle=g; cx.beginPath(); cx.arc(TT.P.x,TT.P.y,40,0,Math.PI*2); cx.fill();
    cx.strokeStyle=p.edge; cx.lineWidth=1.5; cx.stroke();
  }

  function spinning(){ return onRecord(deck.arm) && !deck.armDrag && deck.armTarget==null && (deck.embed || deck.wantAudio); }

  function frame(t){
    const dt = Math.min(0.05, (t - (deck.last||t))/1000); deck.last = t;
    // 톤암 자동 이동
    if (deck.armTarget!=null && !deck.armDrag){
      const k = reduce ? 1 : Math.min(1, dt*6);
      deck.arm += (deck.armTarget-deck.arm)*k;
      if (Math.abs(deck.armTarget-deck.arm) < .3){ deck.arm = deck.armTarget; deck.armTarget = null;
        if (deck.pendingPlay){ deck.pendingPlay=false; startAudio(); } }
    }
    // 회전: 서서히 붙고 서서히 멈춤
    const target = spinning() ? (Math.PI*2/PERIOD[deck.speed]) : 0;
    deck.omega += (target-deck.omega) * Math.min(1, dt*(target?1.6:1.1));
    if (!reduce || target) deck.angle += deck.omega*dt;
    // 레코드 밀기 애니메이션
    const S = deck.slide;
    if (!S.drag && S.phase){
      const goal = S.phase==="out" ? S.dir*760 : 0;
      S.x += (goal - S.x) * Math.min(1, dt*(reduce?60:9));
      if (S.phase==="out" && Math.abs(goal-S.x) < 30){ changeTrack(-S.dir); S.x = -S.dir*760; S.phase="in"; }
      else if (S.phase!=="out" && Math.abs(S.x) < .8){ S.x=0; const was=S.phase; S.phase=null; if (was==="in" && deck.wantAudio && onRecord(deck.arm)) startAudio(); }
    }
    draw();
    deck.raf = deckEl.hidden ? 0 : requestAnimationFrame(frame);
  }

  function sizeCanvas(){
    const w = cv.getBoundingClientRect().width || 400, dpr = Math.min(2.5, window.devicePixelRatio||1);
    cv.width = Math.round(w*dpr); cv.height = Math.round(w/0.7*dpr);
    cx.setTransform(cv.width/TT.W,0,0,cv.width/TT.W,0,0);
  }
  window.addEventListener("resize", ()=>{ if(!deckEl.hidden) sizeCanvas(); });

  // ── 재생 제어 ──
  function startAudio(){
    deck.wantAudio = true;
    if (deck.embed) return;
    const a = cur(); if (!a.getAttribute("src")) return;
    a.play().catch(()=>toast("판을 한 번 탭한 뒤 다시 톤암을 올려주세요"));
  }
  function stopAudio2(){ da.pause(); da2.pause(); }
  function dropArm(){ ensureCtx(); deck.wantAudio=true; deck.armTarget=TT.DROP; deck.pendingPlay=true; updatePlayBtn(); }
  function liftArm(){ stopAudio2(); deck.wantAudio=false; deck.pendingPlay=false; deck.armTarget=TT.REST; updatePlayBtn(); }
  function updatePlayBtn(){ const on = deck.wantAudio; $("#playBtn").textContent = on ? "■ 정지" : "▶ 재생"; }
  function onEnded(){
    if (deck.i < deck.songs.length-1 && nextIndex(1)!=null){ load(nextIndex(1)); startAudio(); }
    else { liftArm(); toast("앨범 끝까지 들었어요"); }
  }
  function nextIndex(dir){ let i=deck.i; do { i+=dir; } while (i>=0 && i<deck.songs.length && !deck.songs[i].previewUrl); return (i<0||i>=deck.songs.length) ? null : i; }
  function changeTrack(dir){ const i = nextIndex(dir); if (i!=null) load(i); }
  function slideTo(dir){ // dir: +1 다음곡(왼쪽으로 빠짐), -1 이전곡
    if (deck.slide.phase==="out") return;
    if (nextIndex(dir)==null){ toast(dir>0?"마지막 곡이에요":"첫 곡이에요"); deck.slide.phase="back"; return; }
    stopAudio2(); deck.slide.dir = -dir; deck.slide.phase="out";
  }

  function load(i){
    deck.i=i; const s=deck.songs[i];
    $("#nowT").textContent=s.trackName; $("#nowA").textContent=s.artistName;
    stopAudio2();
    if (useFallback){ da2.src = s.previewUrl||""; } else { da.src = s.previewUrl||""; }
    $("#bar").style.width="0"; $("#tCur").textContent="0:00"; $("#tDur").textContent="0:30";
    document.querySelectorAll("#queue li").forEach(li=>li.classList.toggle("cur", +li.dataset.i===i));
    const c=document.querySelector("#queue li.cur"); if(c) c.scrollIntoView({block:"nearest"});
    if (deck.embed) setEmbed();
  }

  function tint(url){
    const img = new Image(); img.crossOrigin="anonymous";
    img.onload = () => { try{
      const c=document.createElement("canvas"); c.width=c.height=12; const x=c.getContext("2d"); x.drawImage(img,0,0,12,12);
      const d=x.getImageData(0,0,12,12).data; let r=0,g=0,b=0,n=0;
      for(let k=0;k<d.length;k+=4){ const w=1+(Math.max(d[k],d[k+1],d[k+2])-Math.min(d[k],d[k+1],d[k+2]))/40; r+=d[k]*w; g+=d[k+1]*w; b+=d[k+2]*w; n+=w; }
      const L=v=>Math.round(v/n*.7+255*.3); deckEl.style.setProperty("--vc",`rgb(${L(r)},${L(g)},${L(b)})`);
    }catch(_){} };
    img.src = url.replace(/\/\d+x\d+bb\./,"/60x60bb.");
  }

  function openDeck(album, songs, start, autoplay){
    if (!album || !songs.length) return;
    stopAudio(); // 상세 시트 미리듣기 정지
    Object.assign(deck, { album, songs, embed:false, arm:TT.REST, armTarget:null, armDrag:null, pendingPlay:false, wantAudio:false, omega:0 });
    deck.slide = { x:0, drag:null, phase:null, dir:0 };
    $("#embedWrap").hidden=true; $("#embed").src="about:blank"; $("#embedBtn").textContent="여기서 전곡 듣기 (애플 로그인)";
    $("#nowCover").src = album.cover;
    $("#amLink").href = album.url || "#"; $("#amLink").hidden = !album.url;
    $("#queue").innerHTML = songs.map((s,k)=>`<li data-i="${k}" class="${s.previewUrl?"":"nopv"}"><span class="no">${s.trackNumber}</span><span class="nm">${esc(s.trackName)}</span></li>`).join("");
    tint(album.cover);
    deck.cover = new Image(); deck.cover.onload = buildVinyl; deck.cover.onerror = buildVinyl; deck.cover.src = album.cover;
    buildVinyl();
    deckEl.hidden=false; document.body.style.overflow="hidden"; sizeCanvas();
    let i=start; while (i<songs.length && !songs[i].previewUrl) i++;
    load(i<songs.length ? i : 0); updatePlayBtn();
    if (!deck.raf) { deck.last=0; deck.raf=requestAnimationFrame(frame); }
    if (autoplay) dropArm();
  }
  function closeDeck(){ stopAudio2(); deck.wantAudio=false; $("#embed").src="about:blank"; deckEl.hidden=true; document.body.style.overflow=""; }
  function setEmbed(){ const s=deck.songs[deck.i]; $("#embed").src=`https://embed.music.apple.com/kr/album/${encodeURIComponent(deck.album.id)}${s&&s.trackId?"?i="+s.trackId:""}`; }

  // ── 손으로 조작: 볼륨 노브 돌리기 / 톤암 끌기 / 레코드 밀기 / 속도 노브 탭 ──
  function local(e){ const r=cv.getBoundingClientRect(); return { x:(e.clientX-r.left)/r.width*TT.W, y:(e.clientY-r.top)/r.height*TT.H }; }
  function armAngleAt(pt){ let d=Math.atan2(pt.y-TT.P.y, pt.x-TT.P.x)*180/Math.PI; if (d<0) d+=360;
    if (d>=90 && d<TT.REST) d=TT.REST; else if (d<90 || d>TT.MAX) d=TT.MAX; return d; }
  function hitArm(pt){ const a=-rad(deck.arm), dx=pt.x-TT.P.x, dy=pt.y-TT.P.y;
    const lx=dx*Math.cos(a)-dy*Math.sin(a), ly=dx*Math.sin(a)+dy*Math.cos(a);
    return (lx>-175 && lx<TT.L+12 && Math.abs(ly)<26) || Math.hypot(dx,dy)<42; }
  const knobAngle = pt => Math.atan2(pt.x-TT.VK.x, -(pt.y-TT.VK.y))*180/Math.PI;

  cv.addEventListener("pointerdown", e=>{
    ensureCtx();
    const pt=local(e);
    if (Math.hypot(pt.x-TT.VK.x, pt.y-TT.VK.y) < TT.VK.r+22){ deck.knobDrag={ prev:knobAngle(pt), y:pt.y }; }
    else if (Math.hypot(pt.x-TT.SK.x, pt.y-TT.SK.y) < TT.SK.r+16){ deck.speed = deck.speed===33?45:33; return; }
    else if (hitArm(pt)){
      deck.armDrag = { off: deck.arm - armAngleAt(pt) }; deck.armTarget=null; deck.pendingPlay=false;
      if (deck.wantAudio){ stopAudio2(); } // 바늘을 들면 소리가 멈춤
    }
    else if (Math.hypot(pt.x-TT.C.x-deck.slide.x, pt.y-TT.C.y) < TT.R && deck.slide.phase!=="out"){ deck.slide.drag={ x0:pt.x, base:deck.slide.x }; deck.slide.phase=null; }
    else return;
    cv.setPointerCapture(e.pointerId); cv.style.cursor="grabbing"; e.preventDefault();
  });
  cv.addEventListener("pointermove", e=>{
    const pt=local(e);
    if (deck.knobDrag){ const a=knobAngle(pt); let d=a-deck.knobDrag.prev; if(d>180) d-=360; if(d<-180) d+=360; deck.knobDrag.prev=a;
      deck.vol = Math.max(0, Math.min(1, deck.vol + d/270)); applyVol(); }
    else if (deck.armDrag){ deck.arm = Math.max(TT.REST, Math.min(TT.MAX, armAngleAt(pt)+deck.armDrag.off)); }
    else if (deck.slide.drag){ const dx = pt.x - deck.slide.drag.x0; deck.slide.x = deck.slide.drag.base + dx; }
  });
  function endPointer(){
    cv.style.cursor="grab";
    if (deck.knobDrag){ deck.knobDrag=null; try{ localStorage.setItem("lp-shelf-vol", String(deck.vol)); }catch(_){} }
    if (deck.armDrag){ deck.armDrag=null;
      if (onRecord(deck.arm)){ startAudio(); }          // 판 위에 내려놓으면 재생
      else { deck.wantAudio=false; stopAudio2(); deck.armTarget=TT.REST; } // 밖이면 정지 후 받침으로
      updatePlayBtn(); }
    if (deck.slide.drag){ const dx=deck.slide.x; deck.slide.drag=null;
      if (Math.abs(dx) > 110) slideTo(dx<0 ? 1 : -1); else deck.slide.phase="back"; }
  }
  cv.addEventListener("pointerup", endPointer);
  cv.addEventListener("pointercancel", endPointer);
  cv.addEventListener("wheel", e=>{ const pt=local(e); if (Math.hypot(pt.x-TT.VK.x, pt.y-TT.VK.y) < TT.VK.r+30){ e.preventDefault(); deck.vol=Math.max(0,Math.min(1,deck.vol - e.deltaY/800)); applyVol(); } }, {passive:false});

  $("#playBtn").addEventListener("click", ()=> deck.wantAudio ? liftArm() : dropArm());
  $("#nextBtn").addEventListener("click", ()=>{ ensureCtx(); slideTo(1); });
  $("#prevBtn").addEventListener("click", ()=>{ ensureCtx(); const a=cur(); if (a.currentTime>3){ a.currentTime=0; } else slideTo(-1); });
  $("#deckClose").addEventListener("click", closeDeck);
  $("#queue").addEventListener("click", e=>{ const li=e.target.closest("li"); if(!li||li.classList.contains("nopv")) return; ensureCtx(); load(+li.dataset.i); if (onRecord(deck.arm) && deck.wantAudio) startAudio(); else dropArm(); });
  $("#embedBtn").addEventListener("click", ()=>{
    deck.embed = !deck.embed;
    if (deck.embed){ stopAudio2(); setEmbed(); $("#embedWrap").hidden=false; $("#embedBtn").textContent="미리듣기로 돌아가기";
      $("#deckHint").textContent="애플 플레이어에서 로그인하면 전곡이 재생돼요. 볼륨은 그 플레이어나 기기 버튼으로 조절하세요"; if(!onRecord(deck.arm)) { deck.armTarget=TT.DROP; } }
    else { $("#embed").src="about:blank"; $("#embedWrap").hidden=true; $("#embedBtn").textContent="여기서 전곡 듣기 (애플 로그인)";
      $("#deckHint").textContent="톤암을 판 위로 끌어 올리면 재생, 내리면 정지 · 판을 좌우로 밀면 곡 넘김 · 왼쪽 위 노브를 돌려 볼륨 조절";
      if (deck.wantAudio && onRecord(deck.arm)) startAudio(); else liftArm(); }
  });
  document.addEventListener("keydown", e=>{
    if (deckEl.hidden) return;
    if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if (e.key==="Escape") closeDeck();
    else if (e.key===" " && document.activeElement.tagName!=="BUTTON"){ e.preventDefault(); ensureCtx(); deck.wantAudio?liftArm():dropArm(); }
    else if (e.key==="ArrowRight"){ ensureCtx(); slideTo(1); }
    else if (e.key==="ArrowLeft"){ ensureCtx(); slideTo(-1); }
    else if (e.key==="ArrowUp"||e.key==="ArrowDown"){ e.preventDefault(); deck.vol=Math.max(0,Math.min(1,deck.vol+(e.key==="ArrowUp"?.05:-.05))); applyVol(); }
  });
  applyVol();

  // 화면 테마: 자동(기기 설정) → 다크 → 라이트
  const THEMES=[["auto","◐ 자동"],["dark","● 다크"],["light","○ 라이트"]];
  let th="auto"; try{ th=localStorage.getItem("lp-shelf-theme")||"auto"; }catch(_){}
  function applyTheme(){
    if (th==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", th);
    $("#themeBtn").textContent = THEMES.find(t=>t[0]===th)[1];
  }
  $("#themeBtn").addEventListener("click", ()=>{ th = THEMES[(THEMES.findIndex(t=>t[0]===th)+1)%3][0]; try{ localStorage.setItem("lp-shelf-theme", th); }catch(_){} applyTheme(); });
  applyTheme();

  renderShelf();
})();
</script>
</body>
</html>
